name: Next.js CI/CD Pipeline

# متى يتم تشغيل هذا الـ Workflow؟
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # تحديد بيئة التشغيل (سيرفر أوبونتو افتراضي توفره GitHub)
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js بالنسخة المناسبة
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. تثبيت الاعتمادات والحزم
      - name: Install dependencies
        run: npm ci

      # 4. تشغيل فحص الأخطاء البرمجية (ESLint)
      - name: Run Linter
        run: npm run lint

      # 5. بناء التطبيق للتأكد من عدم وجود أخطاء TypeScript أو بناء
      - name: Build Next.js app
        run: npm run build